<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        body{
            background-color: rgb(88, 128, 215);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container{
            font-family:'Courier New', Courier, monospace;
            background-color: white;
            padding: 40px;
            width: 80%;
            max-width: 600px;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .container label[for]{
            display: block;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        .container input[type="text"],
        .container input[type="email"],
        .container input[type="password"],
        .container input[type="date"],
        .container textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-family: inherit;
        }

        .container textarea {
            resize: vertical;
            margin-bottom: 15px;
        }

        .container h1{
            color: red;
            text-align: center;
        }

        .container > p{
            color: #777272;
            text-align: center;
        }

        .container fieldset{
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 5px;
        }

        .opcoes_grupo{
            display: flex;
            flex-direction: column;
            gap: 3px;
            margin-top: 5px;
            margin-bottom: 15px;
        }

        .opcao_item{
            display: flex;
            align-items: center;
            font-weight: normal;
            cursor: pointer;
        }

        .opcao_item input{
            margin-right: 8px;
            margin-bottom: 0%;
            cursor: pointer;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
        }

        button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
    <div class="container">
        <form>
            <fieldset>
                <h1>Formulário</h1>
                <p>Preencha o formulário abaixo</p>
                
                <label for="nome">Nome</label>
                <input type="text" name="nome" id="nome" placeholder="Seu Nome">
                
                <label for="email">Email</label>
                <input type="text" name="email" id="email" placeholder="seu.email@gmail.com">
                
                <label for="senha">Senha</label>
                <input type="password" name="senha" id="senha">

                <label for="data_nascimento">Data de nascimento</label>
                <input type="date" name="data_nascimento" id="data_nascimento">

                <label for="sexo">Sexo</label>
                <div class="opcoes_grupo">
                    <label class="opcao_item"><input type="radio" name="sexo" value="masculino">masculino</label>
                    <label class="opcao_item"><input type="radio" name="sexo" value="feminino">feminino</label>
                    <label class="opcao_item"><input type="radio" name="sexo" value="outro">Outro</label>
                </div>

                <label for="curso">Curso</label>
                <div class="opcoes_grupo">
                    <label class="opcao-item"><input type="radio" name="curso" value="engenharia_software">Engenharia de software</label>
                    <label class="opcao-item"><input type="radio" name="curso" value="ciencia_computacao">Ciência da computação</label>
                </div>

                <label for="interesses">interesses</label>
                <div class="opcoes_grupo">
                    <label class="opcao-item"><input type="checkbox" name="interesses" value="front_end">Front end</label>
                    <label class="opcao-item"><input type="checkbox" name="interesses" value="back_end">Back end</label>
                    <label class="opcao-item"><input type="checkbox" name="interesses" value="IA">Inteligência Artificial</label>
                    <label class="opcao-item"><input type="checkbox" name="interesses" value="banco_dados">Banco de dados</label>
                    <label class="opcao-item"><input type="checkbox" name="interesses" value="cibersegurança">Cibersegurança</label>
                </div>

                <label for="comentarios">Comentários</label>
                <textarea id="comentario" name="comentario" rows="4" maxlength="200" placeholder="Máximo de 200 caracteres"></textarea>

                <label for="upload">Upload de foto</label>
                <input type="file" id="upload" name="upload" accept="image/*">
            </fieldset>
            <button type="submit">Enviar formulário</button>
        </form>
    </div>
</body>
</html>
